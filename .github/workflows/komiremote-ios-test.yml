name: KomiRemote iOS unsigned controller test (manual)

# Manual unsigned iphoneos build only. No release, no tag, no secrets, no
# Apple Developer signature. Never call the upstream release workflow or the
# reserved macOS test workflow. The .app cannot be installed on an iPhone without a separate
# signing step that this repository does not have.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komiremote-ios-test-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_SOURCES: clear
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  NASM_URL: https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
  # nasm.us publishes no checksum file; pinned from the archive fetched 2026-11-02.
  NASM_SHA256: 0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75

jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Linux generation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
          targets: x86_64-unknown-linux-gnu
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.22.3
          cache: false
      - name: Generate bridge in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter/pubspec.yaml')
          text = p.read_text()
          assert text.count('extended_text: 14.0.0') == 1
          assert 'version: 1.5.1+92' in text
          p.write_text(text.replace('extended_text: 14.0.0', 'extended_text: 13.0.0'))
          PY
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
          git restore flutter/pubspec.yaml flutter/pubspec.lock
          for f in src/bridge_generated.rs src/bridge_generated.io.rs flutter/lib/generated_bridge.dart flutter/lib/generated_bridge.freezed.dart flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h; do
            test -s "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: komiremote-ios-bridge
          retention-days: 3
          if-no-files-found: error
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  ios:
    name: iphoneos-arm64-unsigned
    needs: bridge
    runs-on: macos-14
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: komiremote-ios-bridge
          path: .
      - name: Install checksum-pinned NASM 2.16.03
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o nasm.zip "$NASM_URL"
          echo "$NASM_SHA256  nasm.zip" | shasum -a 256 -c -
          unzip -q nasm.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version
          brew install yasm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Patch Flutter
        run: |
          set -euo pipefail
          sdk="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$sdk" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: rustfmt
      - name: Refuse a signed or host-capable identity
        run: |
          set -euo pipefail
          python3 tests/test_ios_controller_bounds.py
          test "$(sed -n 's/^version: *//p' flutter/pubspec.yaml)" = "1.5.1+92"
          test ! -f flutter/ios/Runner/bridge_generated.h || test -s flutter/ios/Runner/bridge_generated.h
      - name: Name-resolution unit test
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter test --timeout 60s test/komi_public_names_test.dart
      - name: Prepare pinned vcpkg and arm64-ios dependencies
        run: |
          set -euo pipefail
          export VCPKG_ROOT="$RUNNER_TEMP/komi-vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT_ID"
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT_ID"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed" --disable-metrics; then
            find "$VCPKG_ROOT/buildtrees" -name '*.log' -newer "$VCPKG_ROOT/vcpkg" -exec tail -n 80 {} + || true
            exit 1
          fi
      - name: Build static controller library
        run: |
          set -euo pipefail
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
          test -s target/aarch64-apple-ios/release/liblibrustdesk.a
          nm -gU target/aarch64-apple-ios/release/liblibrustdesk.a | grep -E ' _komi_ios_directory_context$'
          nm -gU target/aarch64-apple-ios/release/liblibrustdesk.a | grep -E ' _komi_names_call$' && {
            echo "management export must not be linked into the iOS controller"
            exit 1
          } || true
      - name: Build unsigned iphoneos app
        working-directory: flutter
        run: |
          set -euo pipefail
          # Do not use exportOptions.plist: it is an upstream App Store export
          # for another team's identifier and is not a signature we possess.
          flutter build ios --release --no-codesign
          app=build/ios/iphoneos/Runner.app
          test -d "$app"
          test -s "$app/Runner"
          test ! -f "$app/embedded.mobileprovision"
      - name: Record unsigned bundle
        run: |
          set -euo pipefail
          app=flutter/build/ios/iphoneos/Runner.app
          mkdir -p komiremote-ios-output
          ditto -c -k --keepParent "$app" komiremote-ios-output/KomiRemote-1.5.1-92-iphoneos-arm64-UNSIGNED.zip
          {
            echo "artifact: unsigned iphoneos arm64 .app inside the zip"
            echo "installable_on_iphone: no — no Apple Developer signature, no provisioning profile"
            echo "role: controller only; iPhone screen sharing and accessibility are not included"
            echo "camera_microphone_emission: not included"
            echo "version_expected: 1.5.1+92"
            shasum -a 256 komiremote-ios-output/KomiRemote-1.5.1-92-iphoneos-arm64-UNSIGNED.zip
            shasum -a 256 "$app/Runner" target/aarch64-apple-ios/release/liblibrustdesk.a
            stat -f 'zip_bytes: %z' komiremote-ios-output/KomiRemote-1.5.1-92-iphoneos-arm64-UNSIGNED.zip
            stat -f 'runner_bytes: %z' "$app/Runner"
            echo "commit: $GITHUB_SHA run: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT image: ${ImageOS:-} ${ImageVersion:-}"
            for k in CFBundleDisplayName CFBundleName CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
              printf '%s: %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$app/Info.plist")"
            done
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist" && echo "UNEXPECTED microphone permission" && exit 1 || true
            lipo -archs "$app/Runner"
            codesign -dv "$app" 2>&1 || true
            if codesign --verify --deep --strict "$app" >/dev/null 2>&1; then
              echo "UNEXPECTED: bundle verifies as signed"
              exit 1
            fi
            echo "codesign_verify: failed as expected for an unsigned bundle"
          } | tee komiremote-ios-output/bundle-info.txt
          cp LICENCE komiremote-ios-output/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: KomiRemote-1.5.1-92-iphoneos-arm64-UNSIGNED-${{ github.sha }}
          path: komiremote-ios-output/
          retention-days: 7
          if-no-files-found: error
